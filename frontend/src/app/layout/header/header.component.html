<header class="topbar" aria-label="Application header">
  <div class="brand-lockup">
    <img class="brand-mark" src="assets/svgs/brandmark.svg" alt="" aria-hidden="true" />
    <span class="brand-name">TIC TAC TOE</span>
  </div>
  <div class="header-actions">
    <button
      class="theme-toggle"
      type="button"
      [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="toggleTheme()">
      <span class="theme-toggle-icon" aria-hidden="true">{{ theme() === 'dark' ? '☼' : '◐' }}</span>
      <span>{{ theme() === 'dark' ? 'Light' : 'Dark' }}</span>
    </button>
    <div class="connection-state" [class.is-offline]="errorMessage()">
      <span class="signal-dot" aria-hidden="true"></span>
      {{ errorMessage() ? 'API offline' : game() ? 'Session live' : 'Ready to play' }}
    </div>
  </div>
</header>
